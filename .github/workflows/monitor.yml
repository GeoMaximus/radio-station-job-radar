name: Monitor careers pages

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC (08:00/09:00 Romania)
  workflow_dispatch:

permissions:
  contents: write   # to commit data/jobs.db back

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Playwright (only if a source needs it)
        run: |
          if grep -qE '^\s*render:\s*playwright' config/config.yaml; then
            pip install playwright
            playwright install --with-deps chromium
          fi

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobradar

      - name: Commit updated database
        if: always()
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"
          git add data/jobs.db
          git diff --staged --quiet || (git commit -m "Update seen jobs" && git push)
